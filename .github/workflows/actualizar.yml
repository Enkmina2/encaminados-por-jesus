# Dos veces al día actualiza los últimos vídeos del canal y los titulares cristianos
# (datos/videos.json y datos/noticias.json). La web los lee, así que se renuevan solos.
name: Actualizar vídeos y noticias

on:
  schedule:
    # Después de cada publicación del robot (8:00 y 20:30 hora de España).
    # GitHub usa UTC: 9:05 y 21:35 en invierno; 10:05 y 22:35 en verano.
    - cron: "5 8 * * *"
    - cron: "35 20 * * *"
  workflow_dispatch:        # y a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Últimos vídeos de YouTube
        run: python3 scripts/actualizar_videos.py
        continue-on-error: true   # si YouTube falla un día, las noticias se actualizan igual
      - name: Titulares cristianos
        run: python3 scripts/actualizar_noticias.py
        continue-on-error: true
      - name: Guardar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/videos.json datos/noticias.json
          git diff --cached --quiet || git commit -m "Actualizar vídeos y noticias"
          git push
